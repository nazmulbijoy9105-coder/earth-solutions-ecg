name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Dependency security audit
        run: npm audit

      - name: Check migration syntax
        run: |
          for file in migrations/*.js; do
            node --check "$file"
          done

      - name: Verify migration CLI loads
        run: npx node-pg-migrate --help

      - name: Check Neon Auth integration syntax
        run: |
          node --check lib/auth-proxy.cjs
          node --check lib/neon-auth.cjs
          node --check "api/neon-auth/[...path].js"
          node --check public/frontend/neon-auth.js

      - name: Run tests
        run: npm test
