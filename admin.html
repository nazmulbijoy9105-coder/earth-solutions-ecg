<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Earth Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-container"></div>
<div class="admin-login" id="loginScreen"><div class="orb"></div><div class="orb"></div><div class="admin-login-box"><img src="/logo.jpg" alt=""><h2>Admin Dashboard</h2><p>Sign in to manage Earth Solutions</p><form onsubmit="adminLogin(event)"><div class="fg"><label>Password</label><input type="password" id="adminPass" required placeholder="Enter admin password"></div><button type="submit" class="btn btn-p" style="width:100%;justify-content:center">Sign In <i class="fas fa-arrow-right"></i></button></form><div class="auth-err" id="adminErr"></div></div></div>
<div class="dash" id="dashScreen" style="display:none">
<aside class="dash-sb" id="dashSb"><div class="brand"><img src="/logo.jpg" alt=""><span>Earth Solutions</span></div><div class="sec">Main</div><button class="nav-i active" onclick="setTab('overview')"><i class="fas fa-th-large"></i> Overview</button><button class="nav-i" onclick="setTab('inquiries')"><i class="fas fa-envelope"></i> Inquiries <span class="badge" id="inqBadge">0</span></button><button class="nav-i" onclick="setTab('users')"><i class="fas fa-users"></i> Users</button><div class="sec">Insights</div><button class="nav-i" onclick="setTab('analytics')"><i class="fas fa-chart-line"></i> Analytics</button><button class="nav-i" onclick="setTab('sessions')"><i class="fas fa-comments"></i> Sessions</button><div class="sec">System</div><button class="nav-i" onclick="setTab('push')"><i class="fas fa-bell"></i> Push</button><button class="nav-i" onclick="setTab('settings')"><i class="fas fa-gear"></i> Settings</button><div style="margin-top:auto;padding-top:20px"><button class="nav-i" onclick="adminLogout()" style="color:var(--danger)"><i class="fas fa-right-from-bracket"></i> Sign Out</button></div></aside>
<main class="dash-main" id="dashContent"></main>
</div>
<div class="auth-overlay" id="adminModal"><div class="modal-box" id="adminModalContent"></div></div>
<script>
var adminToken=localStorage.getItem('es_admin_token')||'',currentTab='overview';
function toast(m,t){var c=document.getElementById('toast-container'),e=document.createElement('div');e.className='toast '+(t||'info');e.innerHTML='<i class="fas '+({ok:'fa-check-circle',err:'fa-exclamation-circle',info:'fa-info-circle'}[t]||'fa-info-circle')+'"></i> '+m;c.appendChild(e);setTimeout(function(){e.classList.add('out');setTimeout(function(){e.remove()},300)},3500)}
async function adminLogin(e){e.preventDefault();var err=document.getElementById('adminErr');err.style.display='none';try{var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPass').value})});var d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');adminToken=d.token;localStorage.setItem('es_admin_token',adminToken);showDashboard()}catch(ex){err.textContent=ex.message;err.style.display='block'}}
async function adminLogout(){
  var t=adminToken;
  adminToken='';
  localStorage.removeItem('es_admin_token');
  if(t){
    try{
      await fetch('/api/admin/logout',{
        method:'POST',
        headers:{'Authorization':'Bearer '+t}
      });
    }catch(_){}
  }
  document.getElementById('dashScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

function showDashboard(){document.getElementById('loginScreen').style.display='none';document.getElementById('dashScreen').style.display='flex';setTab('overview')}
function ah(){return{'Content-Type':'application/json','Authorization':'Bearer '+adminToken}}
function setTab(t){currentTab=t;document.querySelectorAll('.dash-sb .nav-i').forEach(function(b,i){var tabs=['overview','inquiries','users','analytics','sessions','push','settings'];b.classList.toggle('active',tabs[i]===t)});renderTab()}
async function api(u){var r=await fetch(u,{headers:ah()});if(r.status===401){adminLogout();throw new Error('Session expired')}return await r.json()}
async function renderTab(){var c=document.getElementById('dashContent');switch(currentTab){case'overview':try{var s=await api('/api/admin/stats');c.innerHTML='<div class="dash-hdr"><h1>Dashboard Overview</h1><p>Monitor your platform performance</p></div><div class="stats-row"><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:var(--b50);color:var(--b500)"><i class="fas fa-comments"></i></div></div><div class="sc-val">'+(s.total||0)+'</div><div class="sc-lbl">Total Inquiries</div></div><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:#E6FFF5;color:var(--ok)"><i class="fas fa-robot"></i></div></div><div class="sc-val">'+((s.sources&&s.sources.ai)||0)+'</div><div class="sc-lbl">AI Responses</div></div><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:#E6FAFF;color:var(--accent)"><i class="fas fa-bolt"></i></div></div><div class="sc-val">'+((s.sources&&s.sources.faq)||0)+'</div><div class="sc-lbl">FAQ Hits</div></div><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:#FFF8E6;color:var(--warn)"><i class="fas fa-language"></i></div></div><div class="sc-val">'+((s.byLang&&s.byLang.bn)||0)+'</div><div class="sc-lbl">Bengali Users</div></div></div>';var b=document.getElementById('inqBadge');if(b)b.textContent=s.total||0}catch(ex){c.innerHTML='<p style="color:var(--danger)">Error: '+ex.message+'</p>'}break;case'inquiries':try{var d=await api('/api/admin/inquiries');var q=d.inquiries||d;c.innerHTML='<div class="dash-hdr"><h1>Inquiries</h1><p>Recent chat conversations</p></div><div class="tbl-wrap"><table><thead><tr><th>User</th><th>Stage</th><th>Message</th><th>Source</th><th>Time</th></tr></thead><tbody>'+q.slice(0,50).map(function(i){return'<tr><td style="font-weight:600">'+i.userId+'</td><td>'+(i.stage||'-')+'</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i.preview||'-')+'</td><td><span class="sbadge '+(i.source==='faq'?'review':'active')+'">'+i.source+'</span></td><td>'+new Date(i.time).toLocaleString()+'</td></tr>'}).join('')+'</tbody></table></div>'}catch(ex){c.innerHTML='<p style="color:var(--danger)">Error: '+ex.message+'</p>'}break;case'users':try{var us=await api('/api/admin/users');c.innerHTML='<div class="dash-hdr"><h1>User Management</h1><p>Manage registered users</p></div><div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn btn-p" onclick="openAddUser()"><i class="fas fa-plus"></i> Add User</button></div><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody>'+us.map(function(u){return'<tr><td style="font-weight:600">'+u.name+'</td><td>'+u.email+'</td><td><span class="rbadge '+u.role+'">'+u.role+'</span></td><td><span class="sbadge '+u.status+'">'+u.status+'</span></td><td>'+u.createdAt+'</td><td><div style="display:flex;gap:4px"><button class="btn btn-g btn-sm" onclick="editUser(\''+u.id+'\')"><i class="fas fa-pen"></i></button><button class="btn btn-g btn-sm" style="color:var(--danger)" onclick="delUser(\''+u.id+'\')"><i class="fas fa-trash"></i></button></div></td></tr>'}).join('')+'</tbody></table></div>'}catch(ex){c.innerHTML='<p style="color:var(--danger)">Error: '+ex.message+'</p>'}break;case'analytics':try{var an=await api('/api/admin/analytics');var pv=an.pageviews||{};var tp=Object.entries(pv).sort(function(a,b){return b[1]-a[1]}).slice(0,10);c.innerHTML='<div class="dash-hdr"><h1>Analytics</h1><p>Platform usage insights</p></div><div class="stats-row"><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:var(--b50);color:var(--b500)"><i class="fas fa-eye"></i></div></div><div class="sc-val">'+Object.values(pv).reduce(function(a,b){return a+b},0)+'</div><div class="sc-lbl">Total Pageviews</div></div><div class="stat-card"><div class="sc-top"><div class="sc-icon" style="background:#E6FFF5;color:var(--ok)"><i class="fas fa-file"></i></div></div><div class="sc-val">'+(an.events||[]).length+'</div><div class="sc-lbl">Events</div></div></div><div class="tbl-wrap"><div class="tbl-hdr"><h3>Top Pages</h3></div><table><thead><tr><th>Path</th><th>Views</th></tr></thead><tbody>'+tp.map(function(p){return'<tr><td style="font-weight:600">'+p[0]+'</td><td>'+p[1]+'</td></tr>'}).join('')+'</tbody></table></div>'}catch(ex){c.innerHTML='<p style="color:var(--danger)">Error: '+ex.message+'</p>'}break;case'sessions':try{var se=await api('/api/admin/sessions');c.innerHTML='<div class="dash-hdr"><h1>Active Sessions</h1><p>Current chat sessions</p></div><div class="tbl-wrap"><table><thead><tr><th>User ID</th><th>Stage</th><th>Messages</th><th>Last Active</th></tr></thead><tbody>'+(Array.isArray(se)?se:[]).map(function(s){return'<tr><td style="font-weight:600">'+s.userId+'</td><td>'+(s.stage||'-')+'</td><td>'+(s.messages||[]).length+'</td><td>'+new Date(s.lastActive).toLocaleString()+'</td></tr>'}).join('')+'</tbody></table></div>'}catch(ex){c.innerHTML='<p style="color:var(--danger)">Error: '+ex.message+'</p>'}break;case'push':c.innerHTML='<div class="dash-hdr"><h1>Push Notifications</h1><p>Send notifications to subscribers</p></div><div style="background:var(--w);border-radius:var(--rl);padding:24px;border:1px solid var(--g100);max-width:500px"><div class="fg"><label>Title</label><input type="text" id="pushTitle" placeholder="Notification title"></div><div class="fg"><label>Body</label><input type="text" id="pushBody" placeholder="Notification message"></div><div class="fg"><label>URL (optional)</label><input type="url" id="pushUrl" placeholder="https://"></div><button class="btn btn-p" onclick="sendPush()"><i class="fas fa-paper-plane"></i> Send Broadcast</button></div>';break;case'settings':c.innerHTML='<div class="dash-hdr"><h1>Settings</h1><p>System configuration</p></div><div style="background:var(--w);border-radius:var(--rl);padding:24px;border:1px solid var(--g100);max-width:500px"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Danger Zone</h3><p style="font-size:13px;color:var(--g400);margin-bottom:12px">Reset all inquiry and analytics data.</p><button class="btn btn-d" onclick="resetData()"><i class="fas fa-trash"></i> Reset All Data</button></div>';break}}
function openAddUser(){document.getElementById('adminModalContent').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="font-size:18px;font-weight:700">Add User</h3><button style="background:var(--g100);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px" onclick="closeAM()"><i class="fas fa-xmark"></i></button></div><form onsubmit="addUser(event)"><div class="fg"><label>Name</label><input type="text" id="muName" required></div><div class="fg"><label>Email</label><input type="email" id="muEmail" required></div><div class="fg"><label>Password</label><input type="password" id="muPass" required minlength="8"></div><div class="fg"><label>Role</label><select id="muRole" style="width:100%;padding:11px 14px;border-radius:10px;border:2px solid var(--g200);font-family:inherit;font-size:14px"><option value="user">User</option><option value="admin">Admin</option></select></div><div style="display:flex;gap:10px"><button type="submit" class="btn btn-p"><i class="fas fa-plus"></i> Add</button><button type="button" class="btn btn-s" onclick="closeAM()">Cancel</button></div></form>';document.getElementById('adminModal').classList.add('show')}
async function addUser(e){e.preventDefault();try{var r=await fetch('/api/admin/users',{method:'POST',headers:ah(),body:JSON.stringify({name:document.getElementById('muName').value,email:document.getElementById('muEmail').value,password:document.getElementById('muPass').value,role:document.getElementById('muRole').value})});var d=await r.json();if(!r.ok)throw new Error(d.error||'Failed to add user');closeAM();toast('User added','ok');setTab('users')}catch(ex){toast(ex.message,'err')}}
async function editUser(id){try{var us=await api('/api/admin/users');var u=us.find(function(x){return x.id===id});if(!u)return;document.getElementById('adminModalContent').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="font-size:18px;font-weight:700">Edit User</h3><button style="background:var(--g100);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px" onclick="closeAM()"><i class="fas fa-xmark"></i></button></div><form onsubmit="saveUser(event,\''+id+'\')"><div class="fg"><label>Name</label><input type="text" id="euName" value="'+u.name+'" required></div><div class="fg"><label>Role</label><select id="euRole" style="width:100%;padding:11px 14px;border-radius:10px;border:2px solid var(--g200);font-family:inherit;font-size:14px"><option value="user"'+(u.role==='user'?' selected':'')+' >User</option><option value="admin"'+(u.role==='admin'?' selected':'')+' >Admin</option></select></div><div class="fg"><label>Status</label><select id="euStatus" style="width:100%;padding:11px 14px;border-radius:10px;border:2px solid var(--g200);font-family:inherit;font-size:14px"><option value="active"'+(u.status==='active'?' selected':'')+' >Active</option><option value="pending"'+(u.status==='pending'?' selected':'')+' >Pending</option><option value="inactive"'+(u.status==='inactive'?' selected':'')+' >Inactive</option></select></div><div style="display:flex;gap:10px"><button type="submit" class="btn btn-p"><i class="fas fa-save"></i> Save</button><button type="button" class="btn btn-s" onclick="closeAM()">Cancel</button></div></form>';document.getElementById('adminModal').classList.add('show')}catch(ex){toast(ex.message,'err')}}
async function saveUser(e,id){e.preventDefault();try{var r=await fetch('/api/admin/users/'+id,{method:'PATCH',headers:ah(),body:JSON.stringify({name:document.getElementById('euName').value,role:document.getElementById('euRole').value,status:document.getElementById('euStatus').value})});if(!r.ok)throw new Error('Update failed');closeAM();toast('User updated','ok');setTab('users')}catch(ex){toast(ex.message,'err')}}
async function delUser(id){if(!confirm('Delete this user?'))return;try{await fetch('/api/admin/users/'+id,{method:'DELETE',headers:ah()});toast('User deleted','ok');setTab('users')}catch(ex){toast(ex.message,'err')}}
async function sendPush(){try{var r=await fetch('/api/admin/push/broadcast',{method:'POST',headers:ah(),body:JSON.stringify({title:document.getElementById('pushTitle').value,body:document.getElementById('pushBody').value,url:document.getElementById('pushUrl').value})});var d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');toast('Push sent to '+d.sent+' devices','ok')}catch(ex){toast(ex.message,'err')}}
async function resetData(){if(!confirm('Reset ALL data?'))return;try{await fetch('/api/admin/reset',{method:'POST',headers:ah()});toast('Data reset','ok');setTab('overview')}catch(ex){toast(ex.message,'err')}}
function closeAM(){document.getElementById('adminModal').classList.remove('show')}
document.getElementById('adminModal').addEventListener('click',function(e){if(e.target===this)closeAM()});
if(adminToken)showDashboard();
</script>
</body></html>
